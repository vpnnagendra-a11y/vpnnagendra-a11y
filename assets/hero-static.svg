  </defs>

  <rect width="850" height="320" rx="16" fill="url(#bgGradS)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Blueprint Grid -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40"/><line x1="0" y1="80" x2="850" y2="80"/><line x1="0" y1="120" x2="850" y2="120"/>
    <line x1="0" y1="160" x2="850" y2="160"/><line x1="0" y1="200" x2="850" y2="200"/><line x1="0" y1="240" x2="850" y2="240"/><line x1="0" y1="280" x2="850" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/><line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/><line x1="460" y1="0" x2="460" y2="320"/><line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="660" y1="0" x2="660" y2="320"/><line x1="760" y1="0" x2="760" y2="320"/>
