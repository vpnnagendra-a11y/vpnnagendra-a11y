  <g filter="url(#softShadowS)">
    <polygon points="670,85 735,120 670,155 605,120" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" opacity="0.95"/>
    <polygon points="670,85 735,120 670,155 605,120" fill="url(#cyberCyanS)" opacity="0.18"/>
    <polygon points="605,120 670,155 670,230 605,195" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <polygon points="605,120 670,155 670,230 605,195" fill="url(#neonPurpleS)" opacity="0.25"/>
    <polygon points="670,155 735,120 735,195 670,230" fill="#0B1120" stroke="#A855F7" stroke-width="1.8"/>
    <polygon points="670,155 735,120 735,195 670,230" fill="url(#cyberCyanS)" opacity="0.3"/>

    <path d="M 622 178 L 622 142 L 632 147 L 648 182 L 648 155 L 656 160 L 656 196 L 646 191 L 630 156 L 630 183 Z" fill="url(#cyberCyanS)"/>
    <path d="M 684 163 L 693 198 L 702 163 L 712 158 L 698 213 L 688 213 L 675 168 Z" fill="url(#neonPurpleS)"/>
