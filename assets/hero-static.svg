  <circle cx="670" cy="160" r="120" fill="url(#monogramGlowS)"/>
  <ellipse cx="670" cy="160" rx="98" ry="42" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.6"/>
  <ellipse cx="670" cy="160" rx="112" ry="52" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="14 16" opacity="0.45" transform="rotate(-30 670 160)"/>

