<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 16" width="100%" height="16">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="laserNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes laserScan {
        0% { transform: translateX(50px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(750px); opacity: 0; }
      }
      .laser-spark {
        animation: laserScan 4s ease-in-out infinite alternate;
      }
      @media (prefers-reduced-motion: reduce) {
        .laser-spark { animation: none !important; }
      }
    </style>
  </defs>

  <line x1="0" y1="8" x2="850" y2="8" stroke="url(#dividerGrad)" stroke-width="1.5"/>
  <circle class="laser-spark" cx="50" cy="8" r="4.5" fill="url(#laserNode)"/>
</svg>

