<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <radialGradient id="monogramGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#00F5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes floatMonogram {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(1.5deg); }
      }

      @keyframes orbitRing1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes orbitRing2 {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.08); }
      }

      @keyframes sweepShine {
        0% { transform: translateX(-150px); opacity: 0; }
        25% { opacity: 0.6; }
        50% { transform: translateX(450px); opacity: 0; }
        100% { transform: translateX(450px); opacity: 0; }
      }

      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .animated-monogram {
        transform-origin: 670px 160px;
        animation: floatMonogram 6s ease-in-out infinite;
      }

      .orbit-group-1 {
        transform-origin: 670px 160px;
        animation: orbitRing1 12s linear infinite;
      }

      .orbit-group-2 {
        transform-origin: 670px 160px;
        animation: orbitRing2 8s linear infinite;
      }

      .glow-pulse {
        transform-origin: 670px 160px;
        animation: pulseGlow 6s ease-in-out infinite;
      }

      .shine-bar {
        animation: sweepShine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .status-dot {
        animation: blinkDot 2s ease-in-out infinite;
      }

      /* Respect Reduced Motion */
      @media (prefers-reduced-motion: reduce) {
        .animated-monogram, .orbit-group-1, .orbit-group-2, .glow-pulse, .shine-bar, .status-dot {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="320" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40"/>
    <line x1="0" y1="80" x2="850" y2="80"/>
    <line x1="0" y1="120" x2="850" y2="120"/>
    <line x1="0" y1="160" x2="850" y2="160"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
    <line x1="0" y1="240" x2="850" y2="240"/>
    <line x1="0" y1="280" x2="850" y2="280"/>
    <line x1="60" y1="0" x2="60" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="360" y1="0" x2="360" y2="320"/>
    <line x1="460" y1="0" x2="460" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/>
    <line x1="660" y1="0" x2="660" y2="320"/>
    <line x1="760" y1="0" x2="760" y2="320"/>
  </g>

  <!-- Left Accent Tech Strip -->
  <rect x="0" y="0" width="5" height="320" rx="2" fill="url(#goldAccent)"/>

  <!-- Ambient Monogram Glow -->
  <circle class="glow-pulse" cx="670" cy="160" r="120" fill="url(#monogramGlow)"/>

  <!-- Orbiting Rings Behind Monogram -->
  <g class="orbit-group-1">
    <ellipse cx="670" cy="160" rx="98" ry="42" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.6"/>
    <circle cx="768" cy="160" r="3.5" fill="#00F5FF" filter="url(#glowFilter)"/>
  </g>

  <g class="orbit-group-2">
    <ellipse cx="670" cy="160" rx="112" ry="52" fill="none" stroke="#A855F7" stroke-width="1" stroke-dasharray="14 16" opacity="0.45" transform="rotate(-30 670 160)"/>
    <circle cx="565" cy="160" r="3" fill="#C084FC" filter="url(#glowFilter)"/>
  </g>

  <!-- 3D Monogram Group (Isometric Shield / Hex Prism with 'NV') -->
  <g class="animated-monogram" filter="url(#softShadow)">
    <!-- Isometric Cube / Hex Outer Frame -->
    <!-- Top Face -->
    <polygon points="670,85 735,120 670,155 605,120" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8" opacity="0.95"/>
    <polygon points="670,85 735,120 670,155 605,120" fill="url(#cyberCyan)" opacity="0.18"/>

    <!-- Left Face -->
    <polygon points="605,120 670,155 670,230 605,195" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
    <polygon points="605,120 670,155 670,230 605,195" fill="url(#neonPurple)" opacity="0.25"/>

    <!-- Right Face -->
    <polygon points="670,155 735,120 735,195 670,230" fill="#0B1120" stroke="#A855F7" stroke-width="1.8"/>
    <polygon points="670,155 735,120 735,195 670,230" fill="url(#cyberCyan)" opacity="0.3"/>

    <!-- Monogram 'N' (Left Isometric projection) -->
    <path d="M 622 178 L 622 142 L 632 147 L 648 182 L 648 155 L 656 160 L 656 196 L 646 191 L 630 156 L 630 183 Z" 
          fill="url(#cyberCyan)" filter="url(#glowFilter)"/>

    <!-- Monogram 'V' (Right Isometric projection) -->
    <path d="M 684 163 L 693 198 L 702 163 L 712 158 L 698 213 L 688 213 L 675 168 Z" 
          fill="url(#neonPurple)" filter="url(#glowFilter)"/>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(56, 0)">
    <!-- Active Status Badge -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle class="status-dot" cx="14" cy="13" r="4.5" fill="#10B981"/>
      <text x="27" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.4">
        OPEN TO ROLES &amp; CONTRACTS
      </text>
    </g>

    <!-- Main Name Title -->
    <g transform="translate(0, 114)">
      <!-- Clip path for shine effect -->
      <clipPath id="nameClip">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.8">
          NAGENDRA VANNEMPALLI
        </text>
      </clipPath>

      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="#F8FAFC" letter-spacing="-0.8">
        NAGENDRA VANNEMPALLI
      </text>

      <!-- Sweeping Light Shine -->
      <rect class="shine-bar" x="0" y="-35" width="80" height="45" fill="#38BDF8" opacity="0.35" clip-path="url(#nameClip)" transform="skewX(-25)"/>
    </g>

    <!-- Professional Role Title -->
    <g transform="translate(0, 146)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="url(#goldAccent)" letter-spacing="0.2">
        Python AI Developer | Backend Engineer
      </text>
    </g>

    <!-- Value Proposition Bio -->
    <g transform="translate(0, 186)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" line-height="1.5">
        Engineering high-throughput MySQL pipelines, production REST APIs with FastAPI,
      </text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">
        and intelligent resume-matching architectures integrated with generative LLMs.
      </text>
    </g>

    <!-- Metric Pills Row -->
    <g transform="translate(0, 246)">
      <!-- Pill 1: Regression Models -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="34" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.2"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">R² &gt; 0.85</text>
        <text x="70" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">ML Models</text>
      </g>

      <!-- Pill 2: 30% Pipeline Acceleration -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="146" height="34" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.2"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A855F7">+30% Speed</text>
        <text x="86" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">SQL Pipelines</text>
      </g>

      <!-- Pill 3: Location / Tech -->
      <g transform="translate(304, 0)">
        <rect x="0" y="0" width="168" height="34" rx="8" fill="#0B132B" stroke="#1E293B" stroke-width="1.2"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10B981">Bengaluru, IN</text>
        <text x="98" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">UTC+5:30</text>
      </g>
    </g>
  </g>
</svg>

